<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Défi en direct — Quest</title>
<meta name="theme-color" content="#D42A1C" />
<link rel="icon" href="icon-192.png" />
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* ============================================================
   Défi en direct — écran de l'enseignante (projeté en classe)
   Aucune donnée enregistrée : tout circule par diffusion Supabase
   Realtime (canal « defi-<NIP> ») et disparaît à la fin.
   ============================================================ */
:root{
  --rouge:#D42A1C; --rouge-f:#A81E12; --encre:#1B1614; --texte:#4A423E; --gris:#8C8177;
  --or:#BF831A; --turq:#3F7A8A; --violet:#6B3FA0; --vert:#2E8B57;
  --fond:#FAF7F6; --carte:#FFFDF9; --ligne:#E7DFD0; --rose:#FBE7E4; --sable:#F4EFEA;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root{ color-scheme: light; } html,body{ background:#FAF7F6 !important; color:#1B1614 !important; } }
*{ box-sizing:border-box; }
html,body{ margin:0; background:var(--fond); color:var(--encre); font-family:"Trebuchet MS", system-ui, sans-serif; }
body{ min-height:100vh; }
button{ font:inherit; cursor:pointer; }
.wrap{ max-width:1280px; margin:0 auto; padding:28px 40px 40px; }
.top{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:24px; }
.marque{ display:flex; align-items:center; gap:12px; font-weight:700; font-size:20px; }
.marque .mk{ width:40px; height:40px; border-radius:12px; background:var(--rouge); color:#fff; display:grid; place-items:center; font-size:22px; }
.marque small{ display:block; font-size:11px; letter-spacing:2px; color:var(--or); }
.btn{ border:0; border-radius:14px; padding:14px 26px; font-weight:700; font-size:18px; background:var(--rouge); color:#fff; box-shadow:0 2px 8px rgba(27,22,20,.12); }
.btn:hover{ background:var(--rouge-f); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn.sec{ background:var(--carte); color:var(--encre); border:1px solid var(--ligne); box-shadow:none; }
.btn.sec:hover{ background:var(--sable); }
.carte{ background:var(--carte); border:1px solid var(--ligne); border-radius:20px; box-shadow:0 2px 10px rgba(27,22,20,.06); }
h1{ font-size:40px; margin:0 0 8px; }
.sur{ font-size:12px; font-weight:700; letter-spacing:3px; color:var(--or); text-transform:uppercase; }
.muted{ color:var(--gris); }

/* ---- Configuration ---- */
.config{ display:grid; grid-template-columns: 1.2fr 1fr; gap:28px; align-items:start; }
.config .carte{ padding:28px; }
label.champ{ display:block; font-weight:700; margin:18px 0 8px; }
select, .seg{ width:100%; font:inherit; font-size:17px; padding:12px 14px; border-radius:12px; border:1px solid var(--ligne); background:#fff; color:var(--encre); }
.segs{ display:flex; gap:8px; flex-wrap:wrap; }
.segs button{ flex:1; min-width:70px; padding:12px; border-radius:12px; border:1px solid var(--ligne); background:#fff; font-weight:700; color:var(--texte); }
.segs button.on{ background:var(--rouge); color:#fff; border-color:var(--rouge); }
.resume{ margin-top:18px; padding:14px 16px; border-radius:12px; background:var(--sable); color:var(--texte); font-size:15px; min-height:48px; }
.etapes li{ margin:0 0 14px; line-height:1.45; color:var(--texte); }
.etapes b{ color:var(--encre); }

/* ---- Salle d'attente ---- */
.salle{ display:grid; grid-template-columns: 420px 1fr; gap:32px; align-items:start; }
.rejoindre{ padding:28px; text-align:center; }
.rejoindre .url{ font-size:26px; font-weight:700; margin:8px 0 4px; }
.nip{ font-size:96px; font-weight:800; letter-spacing:10px; color:var(--rouge); line-height:1; margin:8px 0 18px; }
.qr svg{ width:240px; height:240px; }
.joueurs{ padding:28px; min-height:420px; }
.compte{ font-size:56px; font-weight:800; color:var(--encre); }
.totems{ display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
.totem{ padding:10px 16px; border-radius:999px; background:var(--rose); color:var(--rouge-f); font-weight:700; font-size:18px; animation:pop .35s ease; }
@keyframes pop{ from{ transform:scale(.6); opacity:0 } to{ transform:scale(1); opacity:1 } }

/* ---- Question ---- */
.qhaut{ display:flex; align-items:center; justify-content:space-between; gap:20px; }
.qnum{ font-size:18px; font-weight:700; color:var(--gris); }
.chrono{ width:110px; height:110px; border-radius:50%; background:var(--rouge); color:#fff; display:grid; place-items:center; font-size:46px; font-weight:800; flex:none; }
.chrono.fin{ background:var(--encre); }
.enonce{ font-size:38px; line-height:1.25; font-weight:700; margin:18px 0 28px; white-space:pre-line; }
.enonce.long{ font-size:30px; }
.choix{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.ch{ display:flex; align-items:center; gap:18px; padding:22px 24px; border-radius:18px; color:#fff; font-size:24px; font-weight:700; min-height:110px; position:relative; overflow:hidden; }
.ch .lettre{ width:52px; height:52px; border-radius:14px; background:rgba(255,255,255,.22); display:grid; place-items:center; font-size:26px; flex:none; }
.ch .barre{ position:absolute; left:0; bottom:0; height:8px; background:rgba(255,255,255,.55); }
.ch .n{ margin-left:auto; font-size:30px; }
.c0{ background:var(--rouge); } .c1{ background:var(--turq); } .c2{ background:var(--or); } .c3{ background:var(--violet); }
.ch.pale{ opacity:.28; }
.ch.bon{ outline:6px solid var(--vert); outline-offset:3px; }
.reponses{ margin-top:22px; font-size:20px; color:var(--texte); font-weight:700; }
.expl{ margin-top:22px; padding:20px 24px; border-radius:16px; background:#E8F3EC; color:#1E5E3A; font-size:21px; line-height:1.45; }
.expl b{ color:var(--vert); }
.bas{ display:flex; justify-content:space-between; align-items:center; margin-top:26px; gap:16px; }
.top5{ display:flex; gap:10px; flex-wrap:wrap; }
.top5 span{ background:var(--sable); border-radius:999px; padding:8px 14px; font-weight:700; color:var(--texte); }
.top5 span b{ color:var(--rouge); }

/* ---- Podium ---- */
.podium{ display:flex; justify-content:center; align-items:flex-end; gap:22px; margin:30px 0 20px; }
.marche{ width:260px; text-align:center; }
.marche .bloc{ border-radius:18px 18px 0 0; color:#fff; display:grid; place-items:center; font-size:64px; font-weight:800; }
.marche .nom{ font-size:24px; font-weight:800; margin-bottom:6px; }
.marche .pts{ color:var(--gris); font-weight:700; margin-bottom:12px; }
.m1 .bloc{ height:240px; background:var(--or); } .m2 .bloc{ height:180px; background:var(--turq); } .m3 .bloc{ height:130px; background:var(--rouge); }
.suite{ max-width:760px; margin:0 auto; }
.suite div{ display:flex; justify-content:space-between; padding:10px 16px; border-bottom:1px solid var(--ligne); font-size:19px; }
.couronne{ font-size:44px; }
.vide{ text-align:center; padding:60px 20px; color:var(--gris); font-size:20px; }
.erreur{ color:var(--rouge); font-weight:700; margin-top:12px; }
.discret{ background:none; border:0; color:var(--gris); text-decoration:underline; font-size:15px; }
@media (max-width: 900px){ .config,.salle{ grid-template-columns:1fr; } .choix{ grid-template-columns:1fr; } .enonce{ font-size:28px; } .wrap{ padding:20px; } }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="vide">Chargement…</div></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://gejmaxobebsamvfkkpoj.supabase.co";
const SUPABASE_KEY = "sb_publishable_jqf5eYy0Coka5d0-E86JJQ_bCiQDyvD";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
const URL_JOUEUR = "https://questedu.ca/defi/";

/* Les applications Quest dont on peut piger les questions (data.js public de chaque sous-domaine). */
const APPS = [
  ["Santé", [["sasi","SASIQuest"],["pab","PABQuest"],["geriatrie","GériatrieQuest"],["diabete","DiabèteQuest"],["parkinson","ParkinsonQuest"],["pediatrie","PédiatrieQuest"],["perinatalite","PérinatalitéQuest"],["santementale","SantéMentaleQuest"],["cardio","CardioQuest"],["renal","RénalQuest"],["physio","PhysioQuest"]]],
  ["Autres programmes", [["chantier","ChantierQuest"],["soudage","SoudageQuest"],["plomberie","PlomberieQuest"],["mecanique","MécaniqueAutoQuest"],["infographie","InfographieQuest"],["electricite","ÉlectricitéQuest"],["charpenterie","CharpenterieQuest"],["ebenisterie","ÉbénisterieQuest"],["coiffure","CoiffureQuest"],["compta","ComptaQuest"],["secretariat","SecrétariatQuest"],["secmed","SecrétariatMédicalQuest"],["voyage","VoyageQuest"]]],
];
const NOM_APP = Object.fromEntries(APPS.flatMap(([, l]) => l));

/* Totems : MÊMES listes que les apps élèves. Le joueur n'envoie que des indices ;
   l'écran projeté reconstruit le nom lui-même, donc personne ne peut afficher
   un texte de son choix devant la classe. */
const TOTEM_NOUNS = [["🦊","Renard","Fox","m"],["🦦","Loutre","Otter","f"],["🦫","Castor","Beaver","m"],["🦉","Hibou","Owl","m"],["🦡","Blaireau","Badger","m"],["🐺","Loup","Wolf","m"],["🦅","Aigle","Eagle","m"],["🐿️","Écureuil","Squirrel","m"],["🐗","Sanglier","Boar","m"],["🦔","Hérisson","Hedgehog","m"],["🐻","Ours","Bear","m"],["🦌","Cerf","Stag","m"],["🦆","Canard","Duck","m"],["🐇","Lièvre","Hare","m"],["🐢","Tortue","Turtle","f"],["🐸","Grenouille","Frog","f"],["🐝","Abeille","Bee","f"],["🐜","Fourmi","Ant","f"]];
const TOTEM_ADJ = [["Vaillant","Vaillante","Valiant"],["Rusé","Rusée","Cunning"],["Débrouillard","Débrouillarde","Resourceful"],["Malin","Maligne","Clever"],["Adroit","Adroite","Deft"],["Curieux","Curieuse","Curious"],["Ingénieux","Ingénieuse","Ingenious"],["Tenace","Tenace","Tenacious"],["Habile","Habile","Skillful"],["Vif","Vive","Quick"],["Futé","Futée","Sharp"],["Astucieux","Astucieuse","Astute"],["Persévérant","Persévérante","Persistent"],["Audacieux","Audacieuse","Bold"],["Minutieux","Minutieuse","Meticulous"],["Agile","Agile","Agile"],["Bricoleur","Bricoleuse","Handy"],["Éveillé","Éveillée","Bright"],["Appliqué","Appliquée","Diligent"],["Costaud","Costaude","Sturdy"]];
function totemDe(n, a, lang) {
  const N = TOTEM_NOUNS[n], A = TOTEM_ADJ[a];
  if (!N || !A) return null;
  return { emoji: N[0], nom: lang === "en" ? `${A[2]} ${N[2]}` : `${N[1]} ${N[3] === "f" ? A[1] : A[0]}` };
}

const T = {
  fr: { vrai: "Vrai", faux: "Faux" },
  en: { vrai: "True", faux: "False" },
};

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const melanger = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const lire = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const ecrire = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

/* ------------------------------------------------------------------ état */
const S = {
  ecran: "config",
  cfg: Object.assign({ app: "geriatrie", comp: "tout", prog: "tous", nb: 5, duree: 20, lang: "fr" }, lire("defi_cfg", {})),
  banque: null,          // { app, comps:[{id,titre,questions:[...]}] } — questions jouables (choix multiple / vrai-faux / situation)
  chargement: false, erreurChargement: "",
  nip: null, canal: null, hid: Math.random().toString(36).slice(2, 10), seq: 0,
  joueurs: new Map(),    // id → { n, a, pts, gain, ok }
  questions: [], i: -1,
  phase: "lobby",        // lobby · question · resultat · fin
  t0: 0, dureeQ: 20, reponses: new Map(), minuterie: null, pouls: null,
};

/* ---------------------------------------------------- banque de questions */
async function chargerBanque(app) {
  S.chargement = true; S.erreurChargement = ""; S.banque = null; rendre();
  try {
    const r = await fetch(`https://${app}.questedu.ca/data.js`, { cache: "no-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const src = await r.text();
    // data.js déclare des constantes globales (COMPETENCIES…) : on l'exécute isolé et on récupère COMPETENCIES.
    const C = new Function("window", "document", src + "\n;return typeof COMPETENCIES !== 'undefined' ? COMPETENCIES : [];")({}, undefined);
    const comps = C.map((c) => ({
      id: c.id, titre: { fr: c.title_fr || c.id, en: c.title_en || c.title_fr || c.id },
      questions: (c.tiers || []).flatMap((t) => (t.questions || []).filter(jouable).map((q) => Object.assign({ palier: t.level }, q))),
    })).filter((c) => c.questions.length);
    S.banque = { app, comps };
    const ids = comps.map((c) => c.id);
    if (S.cfg.comp !== "tout" && !ids.includes(S.cfg.comp)) S.cfg.comp = "tout";
  } catch (e) {
    S.erreurChargement = "Impossible de charger les questions de cette application. Vérifiez la connexion Internet.";
  }
  S.chargement = false; rendre();
}
function jouable(q) {
  const t = q.type || "qcm";
  if (t === "tf") return typeof q.isTrue === "boolean";
  if (t === "qcm" || t === "scenario") return Array.isArray(q.choices) && q.choices.length >= 2 && q.choices.length <= 4 && q.choices.filter((c) => c.correct).length === 1;
  return false;
}
function aProgrammes() { return !!S.banque && S.banque.comps.some((c) => c.questions.some((q) => Array.isArray(q.programmes))); }
function bassin() {
  if (!S.banque) return [];
  const comps = S.cfg.comp === "tout" ? S.banque.comps : S.banque.comps.filter((c) => c.id === S.cfg.comp);
  return comps.flatMap((c) => c.questions).filter((q) => {
    if (S.cfg.prog === "tous" || !Array.isArray(q.programmes)) return true;
    return q.programmes.includes(S.cfg.prog);
  });
}
function preparerQuestions() {
  const L = S.cfg.lang;
  // Mélange en évitant de piger deux fois le même énoncé.
  const vus = new Set(); const choisies = [];
  for (const q of melanger(bassin())) {
    const cle = q.fr; if (vus.has(cle)) continue; vus.add(cle); choisies.push(q);
    if (choisies.length >= S.cfg.nb) break;
  }
  return choisies.map((q) => {
    const txt = (o) => (L === "en" ? o.en : o.fr) || o.fr || "";
    if ((q.type || "qcm") === "tf") {
      return { type: "tf", texte: txt(q), choix: [T[L].vrai, T[L].faux], bon: q.isTrue ? 0 : 1, expl: L === "en" ? (q.explEn || q.explFr || "") : (q.explFr || "") };
    }
    const ch = melanger(q.choices);
    return { type: q.type || "qcm", texte: txt(q), choix: ch.map(txt), bon: ch.findIndex((c) => c.correct), expl: L === "en" ? (q.explEn || q.explFr || "") : (q.explFr || "") };
  });
}

/* ---------------------------------------------------------- temps réel */
async function ouvrirCanal() {
  S.nip = String(Math.floor(1000 + Math.random() * 9000));
  S.canal = supabase.channel("defi-" + S.nip, { config: { broadcast: { self: false } } });
  S.canal
    .on("broadcast", { event: "rejoindre" }, ({ payload }) => recevoirJoueur(payload))
    .on("broadcast", { event: "reponse" }, ({ payload }) => recevoirReponse(payload));
  await new Promise((ok) => S.canal.subscribe((s) => { if (s === "SUBSCRIBED") ok(); }));
  clearInterval(S.pouls);
  S.pouls = setInterval(diffuser, 1500);   // battement : rattrape les retardataires et les messages perdus
  diffuser();
}
function recevoirJoueur(p) {
  if (!p || typeof p.id !== "string" || p.id.length > 20) return;
  const n = Number(p.n), a = Number(p.a);
  if (!totemDe(n, a, "fr")) return;
  const j = S.joueurs.get(p.id);
  if (j) { j.n = n; j.a = a; }               // changement de totem : on garde les points
  else S.joueurs.set(p.id, { n, a, pts: 0, gain: 0, ok: null });
  diffuser(); if (S.phase === "lobby") rendre();
}
function recevoirReponse(p) {
  if (S.phase !== "question" || !p || !S.joueurs.has(p.id) || p.i !== S.i) return;
  if (S.reponses.has(p.id)) return;          // la première réponse compte
  const c = Number(p.c); const q = S.questions[S.i];
  if (!Number.isInteger(c) || c < 0 || c >= q.choix.length) return;
  S.reponses.set(p.id, { c, ms: performance.now() - S.t0 });
  diffuser(); rendreCompteReponses();
  if (S.reponses.size >= S.joueurs.size) finirQuestion();
}
function etatPublic() {
  const e = { hid: S.hid, seq: ++S.seq, phase: S.phase, lang: S.cfg.lang, app: NOM_APP[S.cfg.app] || "Quest", inscrits: [...S.joueurs.keys()] };
  if (S.phase === "question") {
    const q = S.questions[S.i];
    e.q = { i: S.i, total: S.questions.length, texte: q.texte, choix: q.choix, type: q.type, duree: S.dureeQ * 1000, restant: Math.max(0, S.dureeQ * 1000 - (performance.now() - S.t0)) };
    e.repondu = [...S.reponses.keys()];
  }
  if (S.phase === "resultat" || S.phase === "fin") {
    const cl = classement();
    e.scores = Object.fromEntries(cl.map((j, k) => [j.id, { pts: j.pts, gain: j.gain, ok: j.ok, rang: k + 1 }]));
    e.nbJoueurs = cl.length;
  }
  if (S.phase === "resultat") {
    const q = S.questions[S.i];
    e.r = { i: S.i, total: S.questions.length, bon: q.bon, choix: q.choix, texte: q.texte };
  }
  if (S.phase === "fin") e.podium = classement().slice(0, 3).map((j) => ({ ...totemDe(j.n, j.a, S.cfg.lang), pts: j.pts }));
  return e;
}
function diffuser() {
  if (!S.canal) return;
  S.canal.send({ type: "broadcast", event: "etat", payload: etatPublic() });
}
function classement() {
  return [...S.joueurs.entries()].map(([id, j]) => ({ id, ...j })).sort((x, y) => y.pts - x.pts);
}

/* ------------------------------------------------------------ partie */
function lancerQuestion(i) {
  S.i = i; S.phase = "question"; S.reponses = new Map();
  const q = S.questions[i];
  S.dureeQ = S.cfg.duree + (q.type === "scenario" ? 10 : 0);
  S.t0 = performance.now();
  for (const j of S.joueurs.values()) { j.gain = 0; j.ok = null; }
  clearInterval(S.minuterie);
  S.minuterie = setInterval(() => {
    const r = Math.ceil((S.dureeQ * 1000 - (performance.now() - S.t0)) / 1000);
    const el = document.getElementById("chrono");
    if (el) { el.textContent = Math.max(0, r); if (r <= 5) el.classList.add("fin"); }
    if (r <= 0) finirQuestion();
  }, 200);
  diffuser(); rendre();
}
function finirQuestion() {
  if (S.phase !== "question") return;
  clearInterval(S.minuterie);
  const q = S.questions[S.i];
  for (const [id, j] of S.joueurs) {
    const r = S.reponses.get(id);
    if (!r) { j.ok = null; j.gain = 0; continue; }
    j.ok = r.c === q.bon;
    // 500 points pour une bonne réponse, plus jusqu'à 500 selon la rapidité.
    j.gain = j.ok ? Math.round(500 + 500 * Math.max(0, 1 - r.ms / (S.dureeQ * 1000))) : 0;
    j.pts += j.gain;
  }
  S.phase = "resultat"; diffuser(); rendre();
}
function suivante() {
  if (S.i + 1 < S.questions.length) lancerQuestion(S.i + 1);
  else { S.phase = "fin"; diffuser(); rendre(); }
}
async function creerDefi() {
  S.questions = preparerQuestions();
  if (!S.questions.length) return;
  ecrire("defi_cfg", S.cfg);
  if (!S.canal) await ouvrirCanal();
  S.phase = "lobby"; S.i = -1; S.ecran = "partie";
  diffuser(); rendre();
}
function rejouer() {
  S.questions = preparerQuestions();
  for (const j of S.joueurs.values()) { j.pts = 0; j.gain = 0; j.ok = null; }
  S.phase = "lobby"; S.i = -1; diffuser(); rendre();
}
async function quitter() {
  clearInterval(S.pouls); clearInterval(S.minuterie);
  if (S.canal) { S.phase = "fin"; S.joueurs.clear(); try { await supabase.removeChannel(S.canal); } catch {} }
  S.canal = null; S.nip = null; S.ecran = "config"; S.phase = "lobby"; rendre();
}

/* ------------------------------------------------------------ rendu */
const $app = document.getElementById("app");
const entete = (droite = "") => `
  <div class="top">
    <div class="marque"><span class="mk">🎯</span><span>Défi en direct<small>QUEST · ESPACE ENSEIGNANT</small></span></div>
    <div>${droite}</div>
  </div>`;

function rendre() {
  if (S.ecran === "config") return rendreConfig();
  if (S.phase === "lobby") return rendreSalle();
  if (S.phase === "question") return rendreQuestion();
  if (S.phase === "resultat") return rendreResultat();
  if (S.phase === "fin") return rendrePodium();
}

function rendreConfig() {
  const c = S.cfg;
  const optsApps = APPS.map(([g, l]) => `<optgroup label="${g}">${l.map(([id, nom]) => `<option value="${id}" ${id === c.app ? "selected" : ""}>${nom}</option>`).join("")}</optgroup>`).join("");
  const optsComp = S.banque ? `<option value="tout">Toutes les compétences (mélange)</option>` + S.banque.comps.map((k) => `<option value="${esc(k.id)}" ${k.id === c.comp ? "selected" : ""}>${esc(k.titre[c.lang] || k.titre.fr)} (${k.questions.length})</option>`).join("") : "";
  const n = bassin().length;
  const seg = (cle, vals, fmt) => `<div class="segs">${vals.map((v) => `<button data-seg="${cle}" data-val="${v}" class="${String(c[cle]) === String(v) ? "on" : ""}">${fmt ? fmt(v) : v}</button>`).join("")}</div>`;
  $app.innerHTML = `${entete(`<a class="btn sec" href="./" style="text-decoration:none">← Tableau de bord</a>`)}
  <div class="config">
    <div class="carte">
      <div class="sur">Nouvelle partie</div>
      <h1>Préparer un défi</h1>
      <p class="muted" style="margin:0">Toute la classe répond en même temps, sur son téléphone. Rien n'est enregistré.</p>
      <label class="champ" for="choixApp">Application</label>
      <select id="choixApp">${optsApps}</select>
      <label class="champ" for="comp">Compétence</label>
      ${S.chargement ? `<div class="resume">Chargement des questions…</div>` : S.erreurChargement ? `<div class="erreur">${esc(S.erreurChargement)}</div>` : `<select id="comp">${optsComp}</select>`}
      ${aProgrammes() ? `<label class="champ">Programme</label>${seg("prog", ["tous", "pab", "sasi"], (v) => ({ tous: "PAB et SASI", pab: "PAB", sasi: "SASI" })[v])}` : ""}
      <label class="champ">Nombre de questions</label>${seg("nb", [5, 10, 15])}
      <label class="champ">Temps par question</label>${seg("duree", [15, 20, 30], (v) => v + " s")}
      <label class="champ">Langue</label>${seg("lang", ["fr", "en"], (v) => (v === "fr" ? "Français" : "English"))}
      <div class="resume">${S.banque ? `<b>${n}</b> question${n > 1 ? "s" : ""} disponible${n > 1 ? "s" : ""} — ${Math.min(n, c.nb)} seront pigées au hasard. Les mises en situation ont 10 s de plus.` : "&nbsp;"}</div>
      <div style="margin-top:22px"><button class="btn" id="creer" ${!S.banque || !n ? "disabled" : ""}>Créer le défi →</button></div>
    </div>
    <div class="carte">
      <div class="sur">Comment ça marche</div>
      <ol class="etapes" style="padding-left:20px;margin:16px 0 0">
        <li><b>Projetez cette page.</b> Un code à 4 chiffres et un QR code s'affichent.</li>
        <li><b>Les élèves scannent</b> ou vont sur <b>questedu.ca/defi</b>. Chacun reçoit un totem : aucun nom, aucun compte.</li>
        <li><b>Vous lancez les questions.</b> Les points dépendent de la bonne réponse et de la rapidité.</li>
        <li><b>Après chaque question,</b> la répartition des réponses et l'explication s'affichent. C'est le moment d'en parler.</li>
        <li><b>À la fin,</b> le podium. Puis tout disparaît : rien n'est conservé.</li>
      </ol>
    </div>
  </div>`;
  $app.querySelector("#choixApp").addEventListener("change", (e) => { S.cfg.app = e.target.value; S.cfg.comp = "tout"; chargerBanque(S.cfg.app); });
  const comp = $app.querySelector("#comp"); if (comp) comp.addEventListener("change", (e) => { S.cfg.comp = e.target.value; rendre(); });
  $app.querySelectorAll("[data-seg]").forEach((b) => b.addEventListener("click", () => {
    const k = b.dataset.seg; const v = b.dataset.val; S.cfg[k] = /^\d+$/.test(v) ? Number(v) : v; rendre();
  }));
  const cr = $app.querySelector("#creer"); if (cr) cr.addEventListener("click", () => { cr.disabled = true; cr.textContent = "Connexion…"; creerDefi(); });
}

function qrSvg(texte) {
  try { const q = qrcode(0, "M"); q.addData(texte); q.make(); return q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); } catch { return ""; }
}
function rendreSalle() {
  const L = S.cfg.lang;
  const lien = `${URL_JOUEUR}?pin=${S.nip}`;
  const tot = [...S.joueurs.values()].map((j) => totemDe(j.n, j.a, L)).map((t) => `<span class="totem">${t.emoji} ${esc(t.nom)}</span>`).join("");
  $app.innerHTML = `${entete(`<button class="discret" id="quitter">Annuler le défi</button>`)}
  <div class="salle">
    <div class="carte rejoindre">
      <div class="sur">Rejoignez la partie</div>
      <div class="qr">${qrSvg(lien)}</div>
      <div class="url">questedu.ca/defi</div>
      <div class="muted">Code de la partie</div>
      <div class="nip">${S.nip}</div>
    </div>
    <div class="carte joueurs">
      <div class="sur">${esc(NOM_APP[S.cfg.app])} · ${S.questions.length} questions</div>
      <div style="display:flex;align-items:baseline;gap:14px;margin-top:8px">
        <span class="compte">${S.joueurs.size}</span><span style="font-size:22px;font-weight:700">joueur${S.joueurs.size > 1 ? "s" : ""} dans la partie</span>
      </div>
      ${S.joueurs.size ? `<div class="totems">${tot}</div>` : `<div class="vide">En attente des premiers joueurs…</div>`}
      <div class="bas"><span class="muted">Les retardataires peuvent se joindre en cours de partie.</span>
        <button class="btn" id="go" ${S.joueurs.size ? "" : "disabled"}>Lancer la première question →</button></div>
    </div>
  </div>`;
  $app.querySelector("#go").addEventListener("click", () => lancerQuestion(0));
  $app.querySelector("#quitter").addEventListener("click", quitter);
}

function rendreQuestion() {
  const q = S.questions[S.i];
  const r = Math.ceil((S.dureeQ * 1000 - (performance.now() - S.t0)) / 1000);
  $app.innerHTML = `${entete(`<button class="discret" id="passer">Arrêter le chrono</button>`)}
  <div class="qhaut"><span class="qnum">Question ${S.i + 1} sur ${S.questions.length} · ${esc(NOM_APP[S.cfg.app])}</span><div class="chrono" id="chrono">${Math.max(0, r)}</div></div>
  <div class="enonce ${q.texte.length > 160 ? "long" : ""}">${esc(q.texte)}</div>
  <div class="choix">${q.choix.map((t, k) => `<div class="ch c${k}"><span class="lettre">${"ABCD"[k]}</span><span>${esc(t)}</span></div>`).join("")}</div>
  <div class="reponses" id="nbrep"></div>`;
  rendreCompteReponses();
  $app.querySelector("#passer").addEventListener("click", finirQuestion);
}
function rendreCompteReponses() {
  const el = document.getElementById("nbrep");
  if (el) el.textContent = `${S.reponses.size} réponse${S.reponses.size > 1 ? "s" : ""} sur ${S.joueurs.size}`;
}

function rendreResultat() {
  const q = S.questions[S.i];
  const comptes = q.choix.map((_, k) => [...S.reponses.values()].filter((r) => r.c === k).length);
  const max = Math.max(1, ...comptes);
  const top = classement().slice(0, 5).map((j, k) => { const t = totemDe(j.n, j.a, S.cfg.lang); return `<span>${k + 1}. ${t.emoji} ${esc(t.nom)} · <b>${j.pts}</b></span>`; }).join("");
  const dernier = S.i + 1 >= S.questions.length;
  const nbBons = comptes[q.bon];
  $app.innerHTML = `${entete()}
  <div class="qhaut"><span class="qnum">Question ${S.i + 1} sur ${S.questions.length} · ${nbBons} bonne${nbBons > 1 ? "s" : ""} réponse${nbBons > 1 ? "s" : ""} sur ${S.reponses.size}</span></div>
  <div class="enonce ${q.texte.length > 160 ? "long" : ""}" style="font-size:28px">${esc(q.texte)}</div>
  <div class="choix">${q.choix.map((t, k) => `<div class="ch c${k} ${k === q.bon ? "bon" : "pale"}"><span class="lettre">${k === q.bon ? "✓" : "ABCD"[k]}</span><span>${esc(t)}</span><span class="n">${comptes[k]}</span><span class="barre" style="width:${(comptes[k] / max) * 100}%"></span></div>`).join("")}</div>
  ${q.expl ? `<div class="expl"><b>Pourquoi ?</b> ${esc(q.expl)}</div>` : ""}
  <div class="bas"><div class="top5">${top}</div><button class="btn" id="suite">${dernier ? "Voir le podium 🏆" : "Question suivante →"}</button></div>`;
  $app.querySelector("#suite").addEventListener("click", suivante);
}

function rendrePodium() {
  const cl = classement();
  const t = (j) => totemDe(j.n, j.a, S.cfg.lang);
  const marche = (j, rang) => j ? `<div class="marche m${rang}">${rang === 1 ? `<div class="couronne">👑</div>` : ""}<div class="nom">${t(j).emoji} ${esc(t(j).nom)}</div><div class="pts">${j.pts} points</div><div class="bloc">${rang}</div></div>` : `<div class="marche m${rang}"></div>`;
  const reste = cl.slice(3).map((j, k) => `<div><span>${k + 4}. ${t(j).emoji} ${esc(t(j).nom)}</span><b>${j.pts}</b></div>`).join("");
  $app.innerHTML = `${entete(`<button class="btn sec" id="rejouer">Rejouer avec le même groupe</button> <button class="discret" id="quitter">Terminer</button>`)}
  <div style="text-align:center"><div class="sur">${esc(NOM_APP[S.cfg.app])} · ${S.questions.length} questions</div><h1>Le podium</h1></div>
  ${cl.length ? `<div class="podium">${marche(cl[1], 2)}${marche(cl[0], 1)}${marche(cl[2], 3)}</div>` : `<div class="vide">Aucun joueur.</div>`}
  ${reste ? `<div class="suite carte">${reste}</div>` : ""}`;
  $app.querySelector("#rejouer").addEventListener("click", rejouer);
  $app.querySelector("#quitter").addEventListener("click", quitter);
}

/* Raccourci clavier pour la télécommande de présentation : → ou Espace = étape suivante. */
document.addEventListener("keydown", (e) => {
  if (S.ecran !== "partie" || !["ArrowRight", " ", "PageDown", "Enter"].includes(e.key)) return;
  if (e.target && /INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName)) return;
  e.preventDefault();
  if (S.phase === "lobby" && S.joueurs.size) lancerQuestion(0);
  else if (S.phase === "question") finirQuestion();
  else if (S.phase === "resultat") suivante();
});
window.addEventListener("beforeunload", (e) => { if (S.canal && S.phase !== "fin" && S.joueurs.size) { e.preventDefault(); e.returnValue = ""; } });

rendre();
chargerBanque(S.cfg.app);
</script>
</body>
</html>
